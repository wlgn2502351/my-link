name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          S_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          S_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          S_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          S_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          S_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          S_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          S_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env.production
          else
            [ -n "$S_API_KEY" ] && export NEXT_PUBLIC_FIREBASE_API_KEY="$S_API_KEY"
            [ -n "$S_AUTH_DOMAIN" ] && export NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$S_AUTH_DOMAIN"
            [ -n "$S_PROJECT_ID" ] && export NEXT_PUBLIC_FIREBASE_PROJECT_ID="$S_PROJECT_ID"
            [ -n "$S_STORAGE_BUCKET" ] && export NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$S_STORAGE_BUCKET"
            [ -n "$S_MESSAGING_SENDER_ID" ] && export NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$S_MESSAGING_SENDER_ID"
            [ -n "$S_APP_ID" ] && export NEXT_PUBLIC_FIREBASE_APP_ID="$S_APP_ID"
            [ -n "$S_MEASUREMENT_ID" ] && export NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID="$S_MEASUREMENT_ID"
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
